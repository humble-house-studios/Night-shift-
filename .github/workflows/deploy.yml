# Every push to main: run the story tests, export Night Shift for the web and
# publish it to GitHub Pages (humble-house-studios.github.io/Night-shift-/),
# so the newest night is always one tap away on your phone.
name: Build and deploy to phone

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  # Every line, recorded on the build machine with Kokoro (a free, open-source
  # neural voice; no API keys, no daily limits). Recorded clips are cached,
  # so a push only records the lines that are new or changed.
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: audio/voice
          key: voices-v1-${{ hashFiles('data/voice_lines.json', 'tools/record_voices.py') }}-${{ github.run_id }}
          restore-keys: |
            voices-v1-${{ hashFiles('data/voice_lines.json', 'tools/record_voices.py') }}-
            voices-v1-
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record the lines
        shell: bash
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin
          pip install -q kokoro-onnx soundfile
          python3 tools/record_voices.py models | tee voices.log
          echo "::notice title=Voices::$(tail -1 voices.log)"
      - uses: actions/upload-artifact@v4
        with:
          name: voices
          path: audio/voice
          retention-days: 3

  build:
    needs: voices
    if: always()
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      # The recorded lines, where the game looks them up.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voices
          path: audio/voice
      - name: Voices in place
        shell: bash
        run: echo "::notice title=Voices::$(ls audio/voice 2>/dev/null | grep -c ogg) clips in the build"

      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --import || true

      # The story tests (GUT): every link in the script exists and a whole
      # night plays through to each ending. A failing test stops the build.
      - name: Run story tests
        shell: bash
        run: |
          set +e
          godot --headless -s addons/gut/gut_cmdln.gd 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "\[Failed\]|SCRIPT ERROR|Parse Error" | head -20 | while IFS= read -r line; do
            echo "::error title=Story test::${line}"
          done
          exit $code

      - name: Export web build
        shell: bash
        run: |
          mkdir -v -p build/web
          set +e
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
          { grep -iE "error|failed|cannot|invalid" export.log | grep -v 'Parameter "m" is null' || true; } | head -20 | while IFS= read -r line; do
            echo "::warning title=Godot export::${line}"
          done
          if [ ! -f build/web/index.html ]; then
            tail -15 export.log | while IFS= read -r line; do echo "::error title=Godot log tail::${line}"; done
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
